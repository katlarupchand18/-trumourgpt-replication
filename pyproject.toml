[project]
name = "trumourgpt"
version = "0.1.0"
description = "TrumorGPT: Graph-Based Retrieval-Augmented LLM for Fact-Checking - IEEE Paper Replication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "pandas>=2.1.0",
    "sentencepiece>=0.1.99",
    "transformers>=4.45.0,<4.50.0",
    "torch>=2.4.0,<2.6.0",
    "accelerate>=0.30.0,<1.0.0",
    "bitsandbytes>=0.43.0,<0.45.0",
    "safetensors>=0.4.0,<0.6.0",
    "gensim>=4.3.0",
    "nltk>=3.8.1",
    "spacy>=3.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "ollama>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.27.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trumourgpt*"]
exclude = ["logs*", "data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false